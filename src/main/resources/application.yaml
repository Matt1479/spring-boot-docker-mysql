spring:
  application:
    name: spring-boot-docker-mysql

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      # Create (or update) the database on startup if needed
      ddl-auto: update
    show-sql: true
